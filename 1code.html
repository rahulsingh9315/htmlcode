<!DOCTYPE html>
<html>
    <head> 
        <title>Simple calculator </title>
        <link rel="stylesheet"  href="style.css">
    <body>
        <h2>Simple calculator</h2>
        <input type="number" id="num1" placeholder="enter first number">
        <input type="number" id="num2" placeholder="enter second number">
        <br><br>
        <button onclick="add()">Add</button>
         <p id="result"></p> 
         <script>
            function add(){
                let a = Number(document.getElementById("num1").value);
                let b = Number(document.getElementById("num2").value);
                document.getElementById("result").innerHTML = "Result="+(a+b);
                           }
         </script>
         <button onclick="subtract()">Subtract</button>
            <p id="result1"></p>
            <script>
                function subtract(){
                    let a = Number(document.getElementById("num1").value);
                    let b = Number(document.getElementById("num2").value);
                    document.getElementById("result1").innerHTML = "Result="+(a-b);
                               }
             </script>
             <button onclick="multiply()">Multiply</button>
                <p id="result2"></p>
                <script>
                    function multiply(){
                        let a = Number(document.getElementById("num1").value);
                        let b = Number(document.getElementById("num2").value);
                        document.getElementById("result2").innerHTML = "Result="+(a*b);
                                   }
                 </script>
                 <button onclick="divide()">Divide</button>
                    <p id="result3"></p>
                    <script>
                        function divide(){
                            let a = Number(document.getElementById("num1").value);
                            let b = Number(document.getElementById("num2").value);
                            document.getElementById("result3").innerHTML = "Result="+(a/b);
                                       }
                     </script>
    </body>
</html>
